name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/test_background.cjs
      - run: python3 scripts/package.py


  speech-dependencies:
    name: Speech dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve isolated speech dependencies
        run: |
          python -m venv .venv-speech
          .venv-speech/bin/python -m pip install --disable-pip-version-check --no-input -r requirements-transcription.txt
          .venv-speech/bin/python -m pip check
      - name: Test real decoder, features and locking without a model
        run: .venv-speech/bin/python tests/smoke_speech_dependencies.py
      - name: Audit the resolved environment
        run: |
          python -m pip install --disable-pip-version-check --no-input pip-audit==2.10.0
          site_packages=$(.venv-speech/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          pip-audit --strict --path "$site_packages"
